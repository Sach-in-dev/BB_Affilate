services:
  db:
    image: postgres:17-alpine
    container_name: bb-affiliate-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bb_affiliate}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bb_affiliate"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bb-affiliate-api-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bb_affiliate}
      - PROD_DB_URL=${PROD_DB_URL:-}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://beta.26ritual.com}
      - STOREFRONT_BASE_URL=${STOREFRONT_BASE_URL:-https://beautybarn.in}
      - AFFILIATE_BASE_URL=${AFFILIATE_BASE_URL:-https://beta.26ritual.com}
      - PRODUCT_SYNC_LIMIT=${PRODUCT_SYNC_LIMIT:-20}

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bb-affiliate-ui-prod
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata: